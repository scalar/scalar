name: Publish Integrations

# Reusable workflow that publishes non-Python, non-JS integrations to their registries
# (DockerHub, NuGet, crates.io, Maven Central). Only ever invoked from
# main.yml on pushes to `main`, after the npm-publish job in release.yml
# succeeded — the pr.yml / main.yml trigger split still keeps this workflow
# unreachable from pull requests. Each job is gated by the per-package
# `*_changed` input and the overall `published` flag, and (where applicable)
# runs in a per-registry GitHub Environment so its credentials stay scoped.

on:
  workflow_call:
    inputs:
      published:
        description: "release.yml's package-release detection — gate for every publish"
        type: string
        required: true
      docker_package_changed:
        type: string
        required: true
      mock_server_docker_package_changed:
        type: string
        required: true
      aspnetcore_package_changed:
        type: string
        required: true
      aspire_package_changed:
        type: string
        required: true
      azure_functions_package_changed:
        type: string
        required: true
      rust_package_changed:
        type: string
        required: true
      java_package_changed:
        type: string
        required: true
      # Build-test results from integration-builds.yml — main.yml passes its
      # integration-builds job outputs in directly. A publish runs only when
      # its build-test passed ('true'); an empty value means the build-test
      # was skipped or failed, which keeps the publish gated off — the
      # cross-workflow equivalent of the old
      # `needs: [<integration>-build-test]`.
      docker_build_passed:
        type: string
        required: true
      dotnet_build_passed:
        type: string
        required: true
      rust_build_passed:
        type: string
        required: true
      java_build_passed:
        type: string
        required: true

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  docker-publish:
    if: inputs.published == 'true' && inputs.docker_package_changed == 'true' && inputs.docker_build_passed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-dockerhub
    timeout-minutes: 10
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/docker
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download scalar.js artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: scalar-js
          path: integrations/docker/assets

      - name: Compress static assets
        working-directory: integrations/docker/assets
        run: gzip --keep --verbose --force scalar.js

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1.9.0
        with:
          platforms: |
            linux/amd64
            linux/arm64

      - name: Log in to DockerHub with OIDC
        uses: docker/login-action@v4.5.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: scalarapi

      - name: Build and Push Docker image
        uses: useblacksmith/build-push-action@v2.2.0
        with:
          context: integrations/docker
          file: integrations/docker/Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            scalarapi/api-reference:latest
            scalarapi/api-reference:${{ steps.package-version.outputs.VERSION }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: scalarapi/api-reference
          readme-filepath: ./integrations/docker/README.md

  mock-server-docker-publish:
    if: inputs.published == 'true' && inputs.mock_server_docker_package_changed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-dockerhub
    timeout-minutes: 10
    concurrency:
      group: mock-server-docker-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Get version from package.json
        id: package-version
        working-directory: packages/mock-server/docker
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download mock server docker entrypoint artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: mock-server-docker-entrypoint
          path: packages/mock-server/docker/dist/

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1.9.0
        with:
          platforms: |
            linux/amd64
            linux/arm64

      - name: Log in to DockerHub with OIDC
        uses: docker/login-action@v4.5.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: scalarapi

      - name: Build and Push Docker image
        uses: useblacksmith/build-push-action@v2.2.0
        with:
          context: packages/mock-server/docker
          file: packages/mock-server/docker/Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            scalarapi/mock-server:latest
            scalarapi/mock-server:${{ steps.package-version.outputs.VERSION }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: scalarapi/mock-server
          readme-filepath: ./packages/mock-server/docker/README.md

  aspnetcore-pack:
    if: inputs.published == 'true' && inputs.aspnetcore_package_changed == 'true' && inputs.dotnet_build_passed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Git Status
        run: git status

      - name: Stash changes
        run: git stash

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/dotnet/aspnetcore
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download scalar.js artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: scalar-js
          path: integrations/dotnet/aspnetcore/src/Scalar.AspNetCore/StaticAssets

      - name: Compress static assets
        working-directory: integrations/dotnet/aspnetcore/src/Scalar.AspNetCore/StaticAssets
        run: gzip --keep --verbose --force scalar.js scalar.aspnetcore.js favicon.svg

      - name: Cache NuGet packages
        uses: actions/cache@v5.1.0
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('integrations/dotnet/**/*.csproj', 'integrations/dotnet/**/Directory.Packages.props') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1.6.0
        with:
          sdk-version: 11.x.x

      - name: Restore dependencies
        working-directory: integrations/dotnet/aspnetcore
        run: dotnet restore

      - name: Pack packages
        working-directory: integrations/dotnet/aspnetcore
        run: |
          dotnet pack src/Scalar.AspNetCore -c Release --no-restore --output nupkgs /p:Version=${{ steps.package-version.outputs.VERSION }}
          dotnet pack src/Scalar.AspNetCore.Microsoft -c Release --no-restore --output nupkgs /p:Version=${{ steps.package-version.outputs.VERSION }}
          dotnet pack src/Scalar.AspNetCore.Swashbuckle -c Release --no-restore --output nupkgs /p:Version=${{ steps.package-version.outputs.VERSION }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aspnetcore-nuget
          path: integrations/dotnet/aspnetcore/nupkgs
          if-no-files-found: error
          retention-days: 1

  # Keep MSBuild targets in a separate job without OIDC permissions.
  aspnetcore-publish:
    needs: aspnetcore-pack
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-nuget
    timeout-minutes: 10
    concurrency:
      group: aspnetcore-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: aspnetcore-nuget
          path: nupkgs

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1.6.0
        with:
          sdk-version: 10.x.x

      - name: Log in to NuGet
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nupkgs/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json

  aspire-docker-publish:
    if: inputs.published == 'true' && inputs.aspire_package_changed == 'true' && inputs.dotnet_build_passed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-dockerhub
    timeout-minutes: 10
    concurrency:
      group: aspire-docker-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/dotnet/aspire
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download scalar.js artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: scalar-js
          path: integrations/dotnet/aspire/src/Scalar.Aspire.Service/wwwroot

      - name: Log in to DockerHub with OIDC
        uses: docker/login-action@v4.5.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: scalarapi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1.9.0
        with:
          platforms: |
            linux/amd64
            linux/arm64

      - name: Build and push Aspire Docker image
        uses: useblacksmith/build-push-action@v2.2.0
        with:
          context: integrations/dotnet
          file: integrations/dotnet/aspire/src/Scalar.Aspire.Service/Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            scalarapi/aspire-api-reference:latest
            scalarapi/aspire-api-reference:${{ steps.package-version.outputs.VERSION }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: scalarapi/aspire-api-reference
          readme-filepath: ./integrations/dotnet/aspire/README.md

  # Pack only after the matching Docker image is published, without OIDC permissions.
  aspire-pack:
    needs: aspire-docker-publish
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Git Status
        run: git status

      - name: Stash changes
        run: git stash

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/dotnet/aspire
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set version in Constants.cs
        working-directory: integrations/dotnet/aspire

        run: |
          sed -i 's/ImageTag = "latest"/ImageTag = "'${{ steps.package-version.outputs.VERSION }}'"/' src/Scalar.Aspire/Constants.cs
          cat src/Scalar.Aspire/Constants.cs

      - name: Cache NuGet packages
        uses: actions/cache@v5.1.0
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('integrations/dotnet/**/*.csproj', 'integrations/dotnet/**/Directory.Packages.props') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1.6.0
        with:
          sdk-version: 11.x.x

      - name: Restore dependencies
        working-directory: integrations/dotnet/aspire/src/Scalar.Aspire
        run: dotnet restore

      - name: Pack Scalar.Aspire NuGet package
        working-directory: integrations/dotnet/aspire/src/Scalar.Aspire
        run: dotnet pack -c Release --no-restore --output nupkgs /p:Version=${{ steps.package-version.outputs.VERSION }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aspire-nuget
          path: integrations/dotnet/aspire/src/Scalar.Aspire/nupkgs
          if-no-files-found: error
          retention-days: 1

  # Keep MSBuild targets in a separate job without OIDC permissions.
  aspire-publish:
    needs: aspire-pack
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-nuget
    timeout-minutes: 10
    concurrency:
      group: aspire-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: aspire-nuget
          path: nupkgs

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1.6.0
        with:
          sdk-version: 10.x.x

      - name: Log in to NuGet
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish Scalar.Aspire NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nupkgs/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json

  azure-functions-pack:
    if: inputs.published == 'true' && inputs.azure_functions_package_changed == 'true' && inputs.dotnet_build_passed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Git Status
        run: git status

      - name: Stash changes
        run: git stash

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/dotnet/azure-functions
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download scalar.js artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: scalar-js
          path: integrations/dotnet/azure-functions/src/Scalar.Azure.Functions/StaticAssets

      - name: Compress static assets
        working-directory: integrations/dotnet/azure-functions/src/Scalar.Azure.Functions/StaticAssets
        run: gzip --keep --verbose --force scalar.js scalar.azure.functions.js favicon.svg

      - name: Cache NuGet packages
        uses: actions/cache@v5.1.0
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('integrations/dotnet/**/*.csproj', 'integrations/dotnet/**/Directory.Packages.props') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1.6.0
        with:
          sdk-version: 11.x.x

      - name: Restore dependencies
        working-directory: integrations/dotnet/azure-functions
        run: dotnet restore

      - name: Pack package
        working-directory: integrations/dotnet/azure-functions
        run: dotnet pack src/Scalar.Azure.Functions -c Release --no-restore --output nupkgs /p:Version=${{ steps.package-version.outputs.VERSION }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azure-functions-nuget
          path: integrations/dotnet/azure-functions/nupkgs
          if-no-files-found: error
          retention-days: 1

  # Keep MSBuild targets in a separate job without OIDC permissions.
  azure-functions-publish:
    needs: azure-functions-pack
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-nuget
    timeout-minutes: 10
    concurrency:
      group: azure-functions-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: azure-functions-nuget
          path: nupkgs

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1.6.0
        with:
          sdk-version: 10.x.x

      - name: Log in to NuGet
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nupkgs/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json

  rust-publish:
    if: inputs.published == 'true' && inputs.rust_package_changed == 'true' && inputs.rust_build_passed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-crates
    timeout-minutes: 10
    concurrency:
      group: rust-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Download scalar.js artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: scalar-js
          path: integrations/rust/ui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/rust
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml version
        working-directory: integrations/rust
        env:
          VERSION: ${{ steps.package-version.outputs.VERSION }}
        run: |
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.toml
          cat Cargo.toml | grep version

      - name: Publish to crates.io
        working-directory: integrations/rust
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  java-publish:
    if: inputs.published == 'true' && inputs.java_package_changed == 'true' && inputs.java_build_passed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: production-maven
    concurrency:
      group: java-publish
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Download scalar.js artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: scalar-js
          path: integrations/java/scalar-core/src/main/resources/META-INF/resources/webjars/scalar
      - name: Setup Java
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: '**/java/pom.xml'
          server-id: 'central'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Get version from package.json
        id: package-version
        working-directory: integrations/java
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Set version in parent POM
        working-directory: integrations/java
        run: mvn versions:set -DnewVersion=${{ steps.package-version.outputs.VERSION }} -DgenerateBackupPoms=false
      - name: Build all Java modules
        working-directory: integrations/java
        run: mvn clean package -pl scalar-core,scalar-webmvc,scalar-webflux -am
      - name: Publish all Java modules to Maven Central
        working-directory: integrations/java
        run: mvn deploy -pl scalar-core,scalar-webmvc,scalar-webflux -am
        env:
          # Create an account on Sonatype and add the credentials to the repository secrets.
          # Generate User Token: https://central.sonatype.com/account
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
