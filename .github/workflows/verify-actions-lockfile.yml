name: Verify Actions Lockfile

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Install lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify action dependencies
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
