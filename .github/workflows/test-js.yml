name: JS Tests

# Reusable workflow with the JS-side test suites required for every PR and
# every push to main. The test-packages sharding loop and the test-projects
# discovery loop live here exactly once so pr.yml and main.yml cannot drift.
#
# Both jobs consume the pre-built `build-output` artifact via restore-build —
# the caller's build job is the single source of truth.

on:
  workflow_call:
    inputs:
      run-all:
        description: "'true' tests every workspace. pr.yml passes check-changes' run_all, which is 'false' when a change is contained to some workspaces."
        type: string
        default: 'true'
      affected-paths:
        description: 'Newline-separated workspace paths to test when run-all is not true: the changed workspaces and everything that depends on them.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test-packages:
    # Stays on Blacksmith: on GitHub-hosted runners the shards run their
    # packages about twice as slowly, and CPU-budget tests (workspace-store's
    # example size budget, the request-scripts plugin) hit their timeouts.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2, 3]
        shard-total: [3]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Check built declaration alias imports
        if: matrix.shard-index == 1 && (inputs.run-all == 'true' || contains(inputs.affected-paths, 'packages/'))
        run: pnpm lint:check:dist-dts-aliases
      # check-changes sets run-all for any change under .github/ or
      # documentation/assets/ scripts, which is all these two cover.
      - name: Check contributor README generation
        if: matrix.shard-index == 1 && inputs.run-all == 'true'
        run: |
          pnpm exec tsc --project .github/actions/update-contributors/tsconfig.json
          pnpm vitest .github/actions/update-contributors --run
      - name: Check documentation scripts
        if: matrix.shard-index == 1 && inputs.run-all == 'true'
        run: |
          pnpm exec tsc --project documentation/assets/tsconfig.test.json
          pnpm vitest documentation/assets --run
      - name: Run NestJS example end-to-end tests
        if: matrix.shard-index == 1 && (inputs.run-all == 'true' || contains(inputs.affected-paths, 'examples/nestjs/'))
        run: pnpm --filter '@scalar-examples/nestjs-api-reference-*' test:e2e --runInBand
      # Packages are spread across shards by their rough test duration, so the
      # few slow suites never pile up on one shard. Every shard runs the same
      # deterministic greedy assignment (heaviest package to the lightest
      # shard) and keeps only its own packages.
      #
      # `--only` skips the `^build` dependencies: restore-build already put
      # every dist/ in place, and letting turbo rebuild them on a cache miss
      # used to cost each shard a minute or more.
      #
      # When RUN_ALL is not true, only the packages in AFFECTED_PATHS are
      # spread across the shards; a shard left without any exits early.
      - name: Run tests
        env:
          RUN_ALL: ${{ inputs.run-all }}
          AFFECTED_PATHS: ${{ inputs.affected-paths }}
        run: |
          # Rough test durations in seconds: the median vitest Duration of
          # each package across CI shards. Only the suites that dominate the
          # run are listed; everything else counts as 5. Update these when a
          # suite grows or shrinks a lot.
          declare -A weights=(
            [api-reference]=155
            [api-client]=120
            [blocks]=80
            [components]=75
            [workspace-store]=65
            [server-side-rendering]=55
            [agent-chat]=45
            [mock-server]=45
            [helpers]=40
            [openapi-validator]=35
            [sidebar]=35
            [openapi-parser]=30
            [openapi-to-markdown]=30
            [asyncapi-to-markdown]=30
            [schemas]=30
            [openapi-types]=25
            [highlight]=25
            [pre-post-request-scripts]=15
            [snippetz]=15
            [oas-utils]=15
            [json-magic]=10
            [openapi-upgrader]=10
            [code-highlight]=10
            [postman-to-openapi]=10
            [use-hooks]=10
          )
          shard_total=${{ matrix.shard-total }}
          shard_index=${{ matrix.shard-index }}

          entries=()
          for dir in packages/*/; do
            if [ "$RUN_ALL" != 'true' ] && ! grep -qxF "${dir%/}" <<< "$AFFECTED_PATHS"; then
              continue
            fi
            if grep -q '"test"' "${dir}package.json" 2>/dev/null; then
              name=$(basename "$dir")
              entries+=("${weights[$name]:-5} ${dir%/}")
            fi
          done

          totals=()
          for (( s = 0; s < shard_total; s++ )); do totals[s]=0; done

          args=()
          while read -r weight dir; do
            lightest=0
            for (( s = 1; s < shard_total; s++ )); do
              if (( totals[s] < totals[lightest] )); then lightest=$s; fi
            done
            totals[lightest]=$(( totals[lightest] + weight ))
            if (( lightest == shard_index - 1 )); then
              args+=(--filter "./${dir}")
            fi
          done < <(printf '%s\n' "${entries[@]}" | sort -k1,1nr -k2,2)

          echo "Estimated shard weights: ${totals[*]}"
          if [ ${#args[@]} -eq 0 ]; then
            echo "No packages assigned to this shard, skipping."
            exit 0
          fi
          pnpm turbo "${args[@]}" --only test

  # pnpm workspaces under projects/* with a `test` script. Excludes
  # projects/proxy-scalar-com (Go) — those run in test-proxy-server.
  test-projects:
    if: inputs.run-all == 'true' || contains(inputs.affected-paths, 'projects/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Run project tests
        env:
          RUN_ALL: ${{ inputs.run-all }}
          AFFECTED_PATHS: ${{ inputs.affected-paths }}
        run: |
          args=()
          for dir in projects/*/; do
            [ -f "${dir}package.json" ] || continue
            [ "${dir}" = 'projects/proxy-scalar-com/' ] && continue
            if [ "$RUN_ALL" != 'true' ] && ! grep -qxF "${dir%/}" <<< "$AFFECTED_PATHS"; then
              continue
            fi
            if grep -q '"test"' "${dir}package.json" 2>/dev/null; then
              args+=(--filter "./${dir%/}")
            fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "No projects with a pnpm test script (excluding Go proxy), skipping."
            exit 0
          fi
          # `--only`: the packages these projects depend on are already
          # restored from the build artifact, so do not rebuild them.
          pnpm turbo "${args[@]}" --only test
