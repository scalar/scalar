name: JS Tests

# Reusable workflow with the JS-side test suites required for every PR and
# every push to main. The test-packages sharding loop and the test-projects
# discovery loop live here exactly once so pr.yml and main.yml cannot drift.
#
# Both jobs consume the pre-built `build-output` artifact via restore-build —
# the caller's build job is the single source of truth.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-packages:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2, 3]
        shard-total: [3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore pre-built workspace
        uses: ./.github/actions/restore-build
      - name: Check built declaration alias imports
        if: matrix.shard-index == 1
        run: pnpm lint:check:dist-dts-aliases
      - name: Check contributor README generation
        if: matrix.shard-index == 1
        run: |
          pnpm exec tsc --project .github/actions/update-contributors/tsconfig.json
          pnpm vitest .github/actions/update-contributors --run
      # Packages are spread across shards by their rough test duration, so the
      # few slow suites never pile up on one shard. Every shard runs the same
      # deterministic greedy assignment (heaviest package to the lightest
      # shard) and keeps only its own packages.
      #
      # `--only` skips the `^build` dependencies: restore-build already put
      # every dist/ in place, and letting turbo rebuild them on a cache miss
      # used to cost each shard a minute or more.
      - name: Run tests
        run: |
          # Rough test durations in seconds, measured in CI. Only the suites
          # that dominate the run are listed; everything else counts as 5.
          # Update these when a suite grows or shrinks a lot.
          declare -A weights=(
            [api-reference]=160
            [api-client]=140
            [components]=110
            [blocks]=110
            [workspace-store]=60
            [mock-server]=50
            [helpers]=50
            [sidebar]=45
            [openapi-types]=40
            [openapi-validator]=40
            [asyncapi-to-markdown]=35
            [openapi-parser]=35
            [highlight]=35
            [schemas]=35
            [server-side-rendering]=35
            [openapi-to-markdown]=30
            [pre-post-request-scripts]=30
            [agent-chat]=30
            [snippetz]=25
            [oas-utils]=15
            [json-magic]=10
          )
          shard_total=${{ matrix.shard-total }}
          shard_index=${{ matrix.shard-index }}

          entries=()
          for dir in packages/*/; do
            if grep -q '"test"' "${dir}package.json" 2>/dev/null; then
              name=$(basename "$dir")
              entries+=("${weights[$name]:-5} ${dir%/}")
            fi
          done

          totals=()
          for (( s = 0; s < shard_total; s++ )); do totals[s]=0; done

          args=()
          while read -r weight dir; do
            lightest=0
            for (( s = 1; s < shard_total; s++ )); do
              if (( totals[s] < totals[lightest] )); then lightest=$s; fi
            done
            totals[lightest]=$(( totals[lightest] + weight ))
            if (( lightest == shard_index - 1 )); then
              args+=(--filter "./${dir}")
            fi
          done < <(printf '%s\n' "${entries[@]}" | sort -k1,1nr -k2,2)

          echo "Estimated shard weights: ${totals[*]}"
          if [ ${#args[@]} -eq 0 ]; then
            echo "No packages assigned to this shard, skipping."
            exit 0
          fi
          pnpm turbo "${args[@]}" --only test

  # pnpm workspaces under projects/* with a `test` script. Excludes
  # projects/proxy-scalar-com (Go) — those run in test-proxy-server.
  test-projects:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore pre-built workspace
        uses: ./.github/actions/restore-build
      - name: Run project tests
        run: |
          args=()
          for dir in projects/*/; do
            [ -f "${dir}package.json" ] || continue
            [ "${dir}" = 'projects/proxy-scalar-com/' ] && continue
            if grep -q '"test"' "${dir}package.json" 2>/dev/null; then
              args+=(--filter "./${dir%/}")
            fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "No projects with a pnpm test script (excluding Go proxy), skipping."
            exit 0
          fi
          # `--only`: the packages these projects depend on are already
          # restored from the build artifact, so do not rebuild them.
          pnpm turbo "${args[@]}" --only test
