name: Validate Scalar Configuration

on:
  push:
    branches:
      - main
    paths:
      - 'scalar.config.json'
      - 'documentation/**'
      - '.agents/skills/mock-server/**'
      - '.agents/skills/scalar-docs/**'
      - 'tooling/scripts/**'
  pull_request:
    paths:
      - 'scalar.config.json'
      - 'documentation/**'
      - '.agents/skills/mock-server/**'
      - '.agents/skills/scalar-docs/**'
      - 'tooling/scripts/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate scalar.config.json
    runs-on: blacksmith-2vcpu-ubuntu-2204
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install skill generator dependencies
        run: pnpm install --frozen-lockfile --filter @scalar-internal/build-scripts

      - name: Check published agent skills
        run: pnpm script generate-agent-skills --check

      - name: Validate
        run: npx @scalar/cli@latest project check-config
