name: Next.js starter

on:
  pull_request:
    paths:
      - 'templates/nextjs-api-reference/**'
      - '.github/workflows/nextjs-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Copy the starter outside the workspace
        run: cp -R templates/nextjs-api-reference "$RUNNER_TEMP/nextjs-starter"
      - run: npm ci
        working-directory: ${{ runner.temp }}/nextjs-starter
      - run: npm run lint && npm run build && npm run typecheck
        working-directory: ${{ runner.temp }}/nextjs-starter
      - run: npx playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/nextjs-starter
      - run: npm test
        working-directory: ${{ runner.temp }}/nextjs-starter
