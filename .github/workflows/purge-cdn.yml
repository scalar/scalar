name: Purge CDN

# Purge jsDelivr's cached @scalar/api-reference URLs once npm serves a new
# release, and check that the CDN then serves it.
#
# npm scans every new version before it becomes installable (about five
# minutes, sometimes 15 or more), so a purge sent straight after publishing
# makes jsDelivr cache the previous version for another seven days. Waiting
# for npm inside release.yml would hold the Main workflow, and with it the
# CI-main-base-ci concurrency group, open for that long and queue the next
# push to main. Running after Main completes keeps that wait off the release
# path entirely.
#
# Every Main run triggers this. A release purges all aliases once because a
# fresh response from this runner cannot account for other CDN caches.

on:
  workflow_run:
    workflows: [Main]
    types: [completed]
    branches: [main]
  # Re-run the purge by hand, for example after a jsDelivr outage.
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  # Keep pending purges queued so a later Main completion cannot interrupt
  # a release that is still waiting for npm.
  group: purge-cdn
  queue: max

jobs:
  purge:
    # Nothing here builds anything; a GitHub-hosted runner is free for this
    # public repository, which matters because most of the job is waiting.
    # ubuntu-slim is not an option because it caps jobs at 15 minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Read the triggering Main run's jobs to see whether it published.
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The purge script comes from the same revision as this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tooling/scripts/purge-jsdelivr.sh
          sparse-checkout-cone-mode: false

      - name: Check whether the Main run published to npm
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # A manual run always waits for npm; that is why someone started it.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "wait_for_npm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without a successful npm-publish job the version in package.json
          # may never reach npm, and waiting for it would only time out.
          conclusion=''
          for ((attempt = RUN_ATTEMPT; attempt > 0; attempt--)); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt/jobs" --paginate \
              --jq '.jobs[] | select(.name == "release / npm-publish") | .conclusion')
            # A partial rerun can inherit the publish job from an earlier attempt.
            if [ -n "$conclusion" ]; then
              break
            fi
          done
          echo "npm-publish conclusion: ${conclusion:-not found}"
          if [ "$conclusion" = 'success' ]; then
            echo "wait_for_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wait_for_npm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the API Reference version
        id: release-version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
          WAIT_FOR_NPM: ${{ steps.published.outputs.wait_for_npm }}
        run: |
          read_version() {
            gh api --header 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/packages/api-reference/package.json?ref=$1" | \
              jq -er '.version | strings | select(test("^[0-9A-Za-z.+-]+$"))'
          }

          version=$(read_version "$VERSION_REF")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          purge_all=false
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            purge_all=true
          elif [ "$WAIT_FOR_NPM" = 'true' ]; then
            # Like release.yml, compare the commit with its first parent.
            previous_version=$(read_version "$VERSION_REF%5E")
            if [ "$version" != "$previous_version" ]; then
              purge_all=true
            fi
          fi
          printf 'purge_all=%s\n' "$purge_all" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr once npm serves the release
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
          PURGE_ALL: ${{ steps.release-version.outputs.purge_all }}
          WAIT_FOR_NPM: ${{ steps.published.outputs.wait_for_npm }}
        run: bash ./tooling/scripts/purge-jsdelivr.sh
