name: PR

# Pull-request validation. Runs every required check, fans tests and previews
# out from a single build, and never references release.yml — so a pull request
# has no path to production publish secrets. The "chore: release" PR opened by
# changesets/action is created with a GitHub App token (see the npm-publish job
# in release.yml), so GitHub does not suppress its workflow events and it
# triggers pull_request events like any other PR — getting the same validation.

on:
  pull_request:
  workflow_dispatch: null

# Workflow-level default: read-only. Individual jobs widen as needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-base-ci
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exclude these packages from turbo as they are handled by dedicated jobs
  TURBO_FLAGS: '--concurrency=100% --filter "!./integrations/{java,rust,dotnet,docker,fastapi,django-ninja}/**" --filter "!./projects/proxy-scalar-com/**"'
  # Pin the preview CLI so CI installs the reviewed version.
  NETLIFY_CLI_VERSION: '27.20.1'

jobs:
  # Initial build.
  # We only build the packages and integrations as everything else depends on them
  # turbo is cached to sticky disk and pnpm is cached in the standard actions cache
  build:
    # Every other JS job waits on this one, and a PR's first push builds with
    # an empty turbo cache, so the extra cores pay for themselves here.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for build provenance attestation (scalar.js CDN artifact).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: $/.github/actions/build
        with:
          packages: './{packages,integrations}/**'
          archive-output: 'true'
      - name: Copy and rename standalone.js to scalar.js
        run: |
          mkdir -p temp-artifacts
          cp packages/api-reference/dist/browser/standalone.js temp-artifacts/scalar.js
      - name: Upload scalar.js artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scalar-js
          path: temp-artifacts/scalar.js
          retention-days: 3
      - name: Upload mock server docker entrypoint artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mock-server-docker-entrypoint
          path: packages/mock-server/docker/dist/docker-entrypoint.js
          retention-days: 3
      # Tarball of every workspace dist/ produced above. Consumed by the
      # restore-build composite so downstream JS jobs can fan out without
      # rerunning the build.
      - name: Upload build-output artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 1
          # The tarball is already gzip-compressed; skip the upload action's
          # outer zip-compression pass.
          compression-level: 0
      # Dependabot runs cannot read Actions secrets, including the RelativeCI key.
      - if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
        name: Upload webpack stats to RelativeCI
        uses: relative-ci/agent-action@v3.2.4
        with:
          key: ${{ secrets.RELATIVE_CI_KEY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          webpackStatsFile: ./packages/api-reference/dist/browser/webpack-stats.json

  # Besides the path flags, decides which JS jobs a pull request needs. turbo
  # lists the workspaces the change touches plus everything that depends on
  # them; each gated job runs when a workspace it exercises is in that list.
  # A change turbo cannot attribute to a workspace (lockfile, workspace or
  # turbo config, root package.json, root configs, .github/) runs everything,
  # and so does any failure to compute the list.
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_all: ${{ steps.affected.outputs.run_all }}
      affected_paths: ${{ steps.affected.outputs.affected_paths }}
      run_types: ${{ steps.affected.outputs.run_types }}
      run_build_apps: ${{ steps.affected.outputs.run_build_apps }}
      run_test_js: ${{ steps.affected.outputs.run_test_js }}
      run_test_integrations: ${{ steps.affected.outputs.run_test_integrations }}
      run_test_proxy_server: ${{ steps.affected.outputs.run_test_proxy_server }}
      run_test_server_side_rendering: ${{ steps.affected.outputs.run_test_server_side_rendering }}
      run_test_block_snapshots: ${{ steps.affected.outputs.run_test_block_snapshots }}
      run_test_component_snapshots: ${{ steps.affected.outputs.run_test_component_snapshots }}
      run_test_e2e_api_reference: ${{ steps.affected.outputs.run_test_e2e_api_reference }}
      run_test_e2e_scalar_app: ${{ steps.affected.outputs.run_test_e2e_scalar_app }}
      skipped_by_scope: ${{ steps.affected.outputs.skipped_by_scope }}
      dotnet_changed: ${{ steps.changes.outputs.dotnet_changed }}
      java_changed: ${{ steps.changes.outputs.java_changed }}
      fastapi_changed: ${{ steps.changes.outputs.fastapi_changed }}
      django_ninja_changed: ${{ steps.changes.outputs.django_ninja_changed }}
      rust_changed: ${{ steps.changes.outputs.rust_changed }}
      docker_changed: ${{ steps.changes.outputs.docker_changed }}
      icons_changed: ${{ steps.changes.outputs.icons_changed }}
      galaxy_changed: ${{ steps.changes.outputs.galaxy_changed }}
      galaxy_preview_changed: ${{ steps.changes.outputs.galaxy_preview_changed }}
      api_client_changed: ${{ steps.changes.outputs.api_client_changed }}
      api_reference_changed: ${{ steps.changes.outputs.api_reference_changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # A pull_request run checks out the merge commit; its first parent
          # is the base the change is diffed against.
          fetch-depth: 2
      - id: changes
        uses: $/.github/actions/check-changes
      - uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'package.json'
      # Root dependencies only: turbo reads the workspace graph from the
      # package.json files and the lockfile, not from node_modules.
      - name: Install turbo
        run: pnpm install --filter .
      - name: Find affected workspaces
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          run_all=false
          paths=''
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "Not a pull request: running everything."
            run_all=true
          elif ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::Could not diff against the base: running everything."
            run_all=true
          elif grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|package\.json|\.npmrc|\.nvmrc|vitest\.config\.ts|biome\.json|tsconfig[^/]*\.json|\.github/|documentation/assets/[^/]*\.(js|ts|json)$)' <<< "$changed"; then
            echo "A root or CI file changed: running everything."
            run_all=true
          elif ! paths=$(TURBO_SCM_BASE=HEAD^1 pnpm exec turbo ls --affected --output=json | jq -r '.packages.items[].path' | sort); then
            echo "::warning::turbo could not list the affected workspaces: running everything."
            run_all=true
            paths=''
          fi
          echo "Affected workspaces:"
          echo "${paths:-(none)}"

          # One line per gated job: its pr.yml job id and a regex over the
          # affected paths for the workspaces it exercises. The Go proxy has
          # its own job, so only that job looks at it.
          js_paths=$(grep -vx 'projects/proxy-scalar-com' <<< "$paths" || true)
          skipped=()
          flag() {
            local job=$1 pattern=$2 list=${3-$js_paths} run=false
            if [ "$run_all" = 'true' ] || grep -qE "$pattern" <<< "$list"; then run=true; fi
            echo "run_${job//-/_}=$run" >> "$GITHUB_OUTPUT"
            if [ "$run" = 'false' ]; then skipped+=("$job"); fi
          }
          # types runs through TURBO_FLAGS, which leaves these integrations out.
          typed_paths=$(grep -vE '^integrations/(java|rust|dotnet|docker|fastapi|django-ninja)(/|$)' <<< "$js_paths" || true)
          flag types '.' "$typed_paths"
          flag build-apps '^(examples|projects|tooling)/'
          flag test-js '^(packages|projects|examples/nestjs)/'
          flag test-integrations '^integrations/'
          flag test-proxy-server '^projects/proxy-scalar-com$' "$paths"
          flag test-server-side-rendering '^packages/server-side-rendering$'
          flag test-block-snapshots '^packages/blocks$'
          flag test-component-snapshots '^packages/components$'
          flag test-e2e-api-reference '^packages/api-reference$'
          flag test-e2e-scalar-app '^projects/scalar-app$'

          echo "run_all=$run_all" >> "$GITHUB_OUTPUT"
          echo "skipped_by_scope=${skipped[*]}" >> "$GITHUB_OUTPUT"
          {
            echo 'affected_paths<<AFFECTED_EOF'
            echo "$paths"
            echo 'AFFECTED_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Skipped by scope: ${skipped[*]:-(none)}"

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # prettier and biome versions are pinned in package.json
          cache-dependency-path: 'package.json'
      # Install only root dependencies
      - name: Install dev dependencies
        run: pnpm install --filter .
      - name: Check code quality
        run: pnpm lint:check
      - name: Check formatting
        run: pnpm format:check

  lint-icons:
    if: needs.check-changes.outputs.icons_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, check-changes]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint Component Library Icons
        run: pnpm --filter components lint:icons
      - name: Lint Icon Library Icons
        run: pnpm --filter icons lint:icons

  lint-galaxy:
    if: needs.check-changes.outputs.galaxy_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-changes]
    permissions:
      contents: read
      # Required so the lint results can be posted back to the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # Capture the lint output (warnings do not fail the command) so we can
      # both surface it in the job log and post it to the PR. continue-on-error
      # keeps the comment step running even when spectral:oas reports errors;
      # the captured exit code is replayed at the end to set the job status.
      - name: Lint the Galaxy example document
        id: lint
        run: |
          set +e
          pnpm --filter @scalar/galaxy lint > lint-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat lint-output.txt
      # Only PRs from the same repository have a writable token for comments.
      - name: Build lint comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        run: |
          # Strip ANSI escape codes, npm noise, and the pnpm script echo, then
          # collapse blank lines so the comment shows just the lint findings.
          clean=$(sed -r 's/\x1b\[[0-9;?]*[a-zA-Z]//g' lint-output.txt \
            | grep -v '^npm warn' \
            | grep -v '^> ' \
            | sed '/^[[:space:]]*$/d')
          warnings=$(printf '%s\n' "$clean" | grep -c '^Severity: Warning' || true)
          {
            echo '**Scalar Galaxy Lint**'
            echo ''
            if [ "${{ steps.lint.outputs.exit_code }}" != '0' ]; then
              echo '❌ Linting failed.'
            elif [ "$warnings" -gt 0 ]; then
              echo "⚠️ ${warnings} warning(s) found."
            else
              echo '✅ No issues found.'
            fi
            echo ''
            echo '```'
            printf '%s\n' "$clean"
            echo '```'
          } > lint-comment.md
      - name: Post lint results to the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        uses: thollander/actions-comment-pull-request@v3.0.1
        with:
          file-path: lint-comment.md
          # Reuse (update) the same comment on every new commit instead of
          # posting a new one.
          comment-tag: galaxy-lint
      # Replay the lint exit code so the job fails on real (error-level) issues.
      - name: Report lint status
        if: ${{ !cancelled() }}
        run: exit ${{ steps.lint.outputs.exit_code }}

  types:
    if: needs.check-changes.outputs.run_types == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      # `--only` skips the `build` dependencies of types:check: restore-build
      # already put every package dist/ in place, and turbo used to rebuild
      # whatever missed its cache before it could start checking types.
      #
      # `--cache=local:` turns the turbo cache off for this run, and it must
      # stay off. With `--only`, a task's hash no longer covers the packages
      # it depends on, so a cached pass would be replayed even after an
      # upstream package changed its types.
      #
      # Unless check-changes ran everything, only the affected workspaces are
      # checked. They include every dependent, and with `--only` those are
      # exactly the packages whose types a change can break.
      - name: Check types
        env:
          RUN_ALL: ${{ needs.check-changes.outputs.run_all }}
          AFFECTED_PATHS: ${{ needs.check-changes.outputs.affected_paths }}
        run: |
          args=()
          if [ "$RUN_ALL" != 'true' ]; then
            while IFS= read -r path; do
              if [ -n "$path" ]; then args+=(--filter "./$path"); fi
            done <<< "$AFFECTED_PATHS"
          fi
          pnpm turbo ${{ env.TURBO_FLAGS }} "${args[@]}" --only --cache=local: types:check

  # Builds the examples, projects and tooling that the build job leaves out
  # (it only builds packages and integrations). They depend on those packages,
  # so this restores their dist/ and builds just the apps on top. Without it,
  # an example or scalar-app that no longer builds would only fail after merge.
  # The cache stays off for the same reason as in the types job above.
  build-apps:
    if: needs.check-changes.outputs.run_build_apps == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Build examples, projects and tooling
        run: >-
          pnpm turbo --only --cache=local:
          --filter './examples/**'
          --filter './projects/*'
          --filter '!./projects/proxy-scalar-com'
          --filter './tooling/**'
          build

  knip:
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      # restore-build only restores dist/, while Nuxt configs extend generated .nuxt files.
      - name: Prepare Nuxt configs for Knip
        run: |
          pnpm --filter @scalar/nuxt exec nuxi prepare
          pnpm --filter @scalar-examples/nuxt-playground exec nuxi prepare
      - name: Knip
        run: pnpm lint:knip

  # test-packages (sharded) and test-projects live in test-js.yml so the shell
  # loops cannot drift between pr.yml and main.yml.
  test-js:
    if: needs.check-changes.outputs.run_test_js == 'true'
    needs: [build, check-changes]
    uses: ./.github/workflows/test-js.yml
    with:
      run-all: ${{ needs.check-changes.outputs.run_all }}
      affected-paths: ${{ needs.check-changes.outputs.affected_paths }}

  test-integrations:
    if: needs.check-changes.outputs.run_test_integrations == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    container:
      image: scalarapi/playwright-runner:1.65.1
      options: --privileged
    env:
      HOME: '/root'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Run tests
        run: pnpm turbo --filter './integrations/**' --only test
        # For now we will integrate the E2E tests with the integrations tests as they are quite fast and this avoids another job.
      - name: Run e2e tests
        run: pnpm --filter @scalar/nuxt test:e2e

  test-proxy-server:
    if: needs.check-changes.outputs.run_test_proxy_server == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: projects/proxy-scalar-com/go.mod
          cache: false
      - name: Run tests for the proxy server (Go)
        run: cd projects/proxy-scalar-com && go test -v

  test-server-side-rendering:
    if: needs.check-changes.outputs.run_test_server_side_rendering == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Start SSR playground and verify it responds
        run: |
          pnpm --filter @scalar/server-side-rendering dev &
          pnpm script wait -p 5173
          curl -sSf http://localhost:5173 -o /tmp/response.html
          grep -q "User account created successfully" /tmp/response.html
        timeout-minutes: 2

  test-block-snapshots:
    if: needs.check-changes.outputs.run_test_block_snapshots == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    environment: production-netlify
    container:
      image: scalarapi/playwright-runner:1.65.1
      options: --privileged
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Generate new DEPLOY_ID
        run: echo "DEPLOY_ID=$(pnpx uuid)" >> "$GITHUB_ENV" && echo $DEPLOY_ID
      - name: Build Storybook (@scalar/blocks)
        run: pnpm --filter blocks build:storybook
      - name: Run e2e tests (@scalar/blocks)
        run: pnpm --filter blocks test:e2e:storybook:ci
        # Only when the PR is from the same repository
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Deploy Playwright Report to Netlify
        continue-on-error: true
        run: |
          pnpm dlx --ignore-scripts netlify@${{ env.NETLIFY_CLI_VERSION }} deploy --no-build --dir "./packages/blocks/playwright-report-storybook" \
            --message "Deployed from GitHub (${{ env.DEPLOY_ID }})" \
            --site ${{ vars.NETLIFY_SITE_ID_COMPONENTS_SNAPSHOTS }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --filter @scalar/blocks \
            --alias=${{env.DEPLOY_ID}}
        # Only when the PR is from the same repository
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Add Netlify Playwright Report URL to the PR
        continue-on-error: true
        uses: daun/playwright-report-summary@v4.0.0
        with:
          comment-title: 'Scalar Blocks Snapshot Test Results'
          icon-style: emojis
          report-url: https://${{env.DEPLOY_ID}}--scalar-snapshots.netlify.app
          report-file: packages/blocks/playwright-results-storybook.json
          report-tag: test-blocks-snapshots

  test-e2e-api-reference:
    if: needs.check-changes.outputs.run_test_e2e_api_reference == 'true'
    needs: [build, check-changes]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production-netlify
    container:
      image: scalarapi/playwright-runner:1.65.1
      options: --privileged
      env:
        VM_ID: ${{ env.VM_ID }}
        GITHUB_REPO_NAME: ${{ env.GITHUB_REPO_NAME }}
        BLACKSMITH_STICKYDISK_TOKEN: ${{ env.BLACKSMITH_STICKYDISK_TOKEN }}
        BLACKSMITH_INSTALLATION_MODEL_ID: ${{ env.BLACKSMITH_INSTALLATION_MODEL_ID }}
        BLACKSMITH_REGION: ${{ env.BLACKSMITH_REGION }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Generate new DEPLOY_ID
        run: echo "DEPLOY_ID=$(pnpx uuid)" >> "$GITHUB_ENV" && echo $DEPLOY_ID
      - name: Build storybook (@scalar/api-reference)
        run: pnpm --filter api-reference build:storybook
      - name: Run storybook snapshot tests (@scalar/api-reference)
        run: pnpm --filter api-reference test:e2e:storybook:ci
      - name: Run e2e tests (@scalar/api-reference)
        run: pnpm --filter api-reference test:e2e:ci
      - name: Run documentation browser tests
        run: pnpm exec playwright test documentation/playwright/test
        # Only when the PR is from the same repository
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Deploy Playwright Report to Netlify
        continue-on-error: true
        run: |
          pnpm dlx --ignore-scripts netlify@${{ env.NETLIFY_CLI_VERSION }} deploy --no-build --dir "./packages/api-reference/playwright-report" \
            --message "Deployed from GitHub (${{ env.DEPLOY_ID }})" \
            --site ${{ vars.NETLIFY_SITE_ID_COMPONENTS_SNAPSHOTS }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --filter @scalar/components \
            --alias=${{env.DEPLOY_ID}}
        # Only when the PR is from the same repository
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Add Netlify Playwright Report URL to the PR
        continue-on-error: true
        uses: daun/playwright-report-summary@v4.0.0
        with:
          comment-title: 'Scalar References End to End Test Results'
          icon-style: emojis
          report-url: https://${{env.DEPLOY_ID}}--scalar-snapshots.netlify.app
          report-file: packages/api-reference/playwright-results.json
          report-tag: test-references-e2e
          footer: |
            > [!IMPORTANT]
            > These tests include snapshots that may need to be updated if there are intentional changes to the UI components. To update the snapshots run `pnpm test:e2e --update-snapshots` in `packages/api-reference` and commit the changes.

  test-e2e-scalar-app:
    if: needs.check-changes.outputs.run_test_e2e_scalar_app == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    environment: production-netlify
    container:
      image: scalarapi/playwright-runner:1.65.1
      options: --privileged
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Generate new DEPLOY_ID
        run: echo "DEPLOY_ID=$(pnpx uuid)" >> "$GITHUB_ENV" && echo $DEPLOY_ID
      - name: Run e2e tests (scalar-app)
        run: pnpm --filter scalar-app test:e2e:ci
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Deploy Playwright Report to Netlify
        run: |
          pnpm dlx --ignore-scripts netlify@${{ env.NETLIFY_CLI_VERSION }} deploy --no-build --dir "./projects/scalar-app/playwright-report" \
            --message "Deployed from GitHub (${{ env.DEPLOY_ID }})" \
            --site ${{ vars.NETLIFY_SITE_ID_COMPONENTS_SNAPSHOTS }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --filter @scalar/components \
            --alias=${{env.DEPLOY_ID}}
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Add Netlify Playwright Report URL to the PR
        uses: daun/playwright-report-summary@v4.0.0
        with:
          comment-title: 'Scalar App End to End Test Results'
          icon-style: emojis
          report-url: https://${{env.DEPLOY_ID}}--scalar-snapshots.netlify.app
          report-file: projects/scalar-app/playwright-results.json
          report-tag: test-scalar-app-e2e

  test-component-snapshots:
    if: needs.check-changes.outputs.run_test_component_snapshots == 'true'
    needs: [build, check-changes]
    runs-on: ubuntu-latest
    environment: production-netlify
    container:
      image: scalarapi/playwright-runner:1.65.1
      options: --privileged
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore pre-built workspace
        uses: $/.github/actions/restore-build
      - name: Generate new DEPLOY_ID
        run: echo "DEPLOY_ID=$(pnpx uuid)" >> "$GITHUB_ENV" && echo $DEPLOY_ID
      - name: Run e2e tests (@scalar/components)
        run: pnpm --filter components test:e2e:ci
        # Only when the PR is from the same repository
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Deploy Playwright Report to Netlify
        continue-on-error: true
        run: |
          pnpm dlx --ignore-scripts netlify@${{ env.NETLIFY_CLI_VERSION }} deploy --no-build --dir "./packages/components/playwright-report" \
            --message "Deployed from GitHub (${{ env.DEPLOY_ID }})" \
            --site ${{ vars.NETLIFY_SITE_ID_COMPONENTS_SNAPSHOTS }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --filter @scalar/components \
            --alias=${{env.DEPLOY_ID}}
        # Only when the PR is from the same repository
      - if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.actor, '[bot]') }}
        name: Add Netlify Playwright Report URL to the PR
        continue-on-error: true
        uses: daun/playwright-report-summary@v4.0.0
        with:
          comment-title: 'Scalar Components Snapshot Test Results'
          icon-style: emojis
          report-url: https://${{env.DEPLOY_ID}}--scalar-snapshots.netlify.app
          report-file: packages/components/playwright-results.json
          report-tag: test-components-snapshots

  # Path-gated integration build-tests (dotnet/java/rust/python/docker).
  integration-builds:
    needs: [check-changes, build]
    uses: ./.github/workflows/integration-builds.yml
    with:
      dotnet_changed: ${{ needs.check-changes.outputs.dotnet_changed }}
      java_changed: ${{ needs.check-changes.outputs.java_changed }}
      fastapi_changed: ${{ needs.check-changes.outputs.fastapi_changed }}
      django_ninja_changed: ${{ needs.check-changes.outputs.django_ninja_changed }}
      rust_changed: ${{ needs.check-changes.outputs.rust_changed }}
      docker_changed: ${{ needs.check-changes.outputs.docker_changed }}

  # Preview deploys — same-repo PRs only (forks cannot read deploy secrets).
  # Gating on `!cancelled() && build succeeded` (instead of the implicit
  # all-needs-success gate) keeps the always-on examples and Storybook previews
  # shipping even when check-changes failed. The path-gated previews
  # (api-reference, api-client, galaxy) read check-changes outputs, so they
  # simply skip when those come through empty.
  deploy-previews:
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.actor, '[bot]')
    needs: [check-changes, build]
    uses: ./.github/workflows/deploy-previews.yml
    with:
      api_reference_changed: ${{ needs.check-changes.outputs.api_reference_changed }}
      api_client_changed: ${{ needs.check-changes.outputs.api_client_changed }}
      galaxy_changed: ${{ needs.check-changes.outputs.galaxy_changed }}
      galaxy_preview_changed: ${{ needs.check-changes.outputs.galaxy_preview_changed }}
      pr-number: ${{ github.event.pull_request.number }}
      pr-head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  preview-comment:
    # Only run for PRs from the same repository
    if: |
      always() &&
      (needs.deploy-previews.outputs.api-reference-url != '' ||
       needs.deploy-previews.outputs.components-url != '' ||
       needs.deploy-previews.outputs.api-client-url != '' ||
       needs.deploy-previews.outputs.galaxy-url != '' ||
       needs.deploy-previews.outputs.registry-preview-url != '') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.actor, '[bot]')
    needs: [deploy-previews]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Build comment message
        id: build-message
        env:
          API_REFERENCE_URL: ${{ needs.deploy-previews.outputs.api-reference-url }}
          COMPONENTS_URL: ${{ needs.deploy-previews.outputs.components-url }}
          API_CLIENT_URL: ${{ needs.deploy-previews.outputs.api-client-url }}
          GALAXY_URL: ${{ needs.deploy-previews.outputs.galaxy-url }}
          REGISTRY_PREVIEW_URL: ${{ needs.deploy-previews.outputs.registry-preview-url }}
        run: |
          MESSAGE=""
          [ -n "$API_REFERENCE_URL" ] && MESSAGE="${MESSAGE}**Preview API Reference**\n\n${API_REFERENCE_URL}\n\n"
          [ -n "$COMPONENTS_URL" ] && MESSAGE="${MESSAGE}**Preview Storybook**\n\n${COMPONENTS_URL}\n\n"
          [ -n "$API_CLIENT_URL" ] && MESSAGE="${MESSAGE}**Preview API Client**\n\n${API_CLIENT_URL}\n\n"
          [ -n "$GALAXY_URL" ] && MESSAGE="${MESSAGE}**Preview Galaxy**\n\n${GALAXY_URL}\n\n"
          [ -n "$REGISTRY_PREVIEW_URL" ] && MESSAGE="${MESSAGE}**Scalar Registry Preview**\n\n${REGISTRY_PREVIEW_URL}\n\n"
          {
            echo "message<<EOF"
            printf '%b' "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add combined preview URLs to the PR
        uses: thollander/actions-comment-pull-request@v3.0.1
        with:
          message: ${{ steps.build-message.outputs.message }}
          comment-tag: 'deployment-preview'

  # The scheduled docs bots (CLI docs + contributors) open their PRs with an app
  # token, so this PR workflow runs on them. This job makes sure those bot PRs
  # only ever touch Markdown: if a compromised step tried to smuggle in code or
  # workflow changes, the PR fails here instead of being waved through as a
  # routine docs update. For every other PR the step is skipped and the job
  # simply succeeds, so it can sit in required-jobs-pull-requests without
  # affecting normal PRs. github.head_ref is only read inside expressions and
  # env vars, never interpolated into a shell.
  verify-generated-docs:
    name: Verify generated docs PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if a generated docs PR changes non-Markdown files
        if: >-
          ${{ startsWith(github.head_ref, 'contributors-readme-action-') ||
          github.head_ref == 'docs/update-cli-documentation' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          echo "Changed files:"
          echo "$files"

          non_markdown=$(echo "$files" | grep -viE '\.md$' || true)
          if [ -n "$non_markdown" ]; then
            echo "::error::This generated docs PR may only modify Markdown files, but it changes:"
            echo "$non_markdown"
            exit 1
          fi

          echo "Only Markdown files changed."

  # Every needed job must succeed. The only skip that passes is one
  # check-changes asked for (its skipped_by_scope list); any other skip, a
  # cancel or a failure fails the gate, and so does check-changes failing,
  # because its list then comes through empty.
  required-jobs-pull-requests:
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    needs:
      [
        check-changes,
        build,
        build-apps,
        test-server-side-rendering,
        format,
        knip,
        test-js,
        test-integrations,
        test-proxy-server,
        test-block-snapshots,
        test-component-snapshots,
        test-e2e-api-reference,
        test-e2e-scalar-app,
        types,
        verify-generated-docs,
      ]
    steps:
      - name: Exit with error if some jobs are not successful
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED_BY_SCOPE: ${{ needs.check-changes.outputs.skipped_by_scope }}
        run: |
          failed=$(jq -r --arg allowed "$SKIPPED_BY_SCOPE" '
            ($allowed | split(" ")) as $allowed
            | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or (.key | IN($allowed[]) | not))
            | "\(.key): \(.value.result)"
          ' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "These required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "Skipped by check-changes: ${SKIPPED_BY_SCOPE:-(none)}"
