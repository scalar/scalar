name: Playwright Docker Images

on:
  pull_request:
    paths:
      - '.github/workflows/playwright-docker.yml'
      - '.github/scripts/playwright-docker-smoke.cjs'
      - 'tooling/scripts/src/commands/playwright-docker/**'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/playwright-docker.yml'
      - '.github/scripts/playwright-docker-smoke.cjs'
      - 'tooling/scripts/src/commands/playwright-docker/**'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

env:
  PLAYWRIGHT_DOCKER_DIR: tooling/scripts/src/commands/playwright-docker
  PLAYWRIGHT_DOCKER_SMOKE_TEST: .github/scripts/playwright-docker-smoke.cjs

jobs:
  check-changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      version: ${{ steps.changes.outputs.version }}
      tag: ${{ steps.changes.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Check image inputs and Playwright version
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          playwright_version() {
            git show "$1:pnpm-workspace.yaml" |
              sed -nE "s|^[[:space:]]*['\"]?@playwright/test['\"]?:[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+)['\"]?[[:space:]]*\$|\1|p"
          }

          version=$(playwright_version HEAD)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected one exact @playwright/test version in pnpm-workspace.yaml' >&2
            exit 1
          fi

          # Workspace catalog edits for other packages do not affect either image.
          if [[ "$version" == "$(playwright_version "$BASE_SHA")" ]] &&
             git diff --quiet "$BASE_SHA" HEAD -- \
               .github/workflows/playwright-docker.yml "$PLAYWRIGHT_DOCKER_SMOKE_TEST" "$PLAYWRIGHT_DOCKER_DIR"; then
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'relevant=true'
            echo "version=$version"
            echo "tag=$version-r$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      PLAYWRIGHT_VERSION: ${{ needs.check-changes.outputs.version }}
      IMAGE_TAG: ${{ needs.check-changes.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Build both images
        shell: bash
        run: |
          docker buildx build --load --platform "linux/$ARCH" \
            --build-arg "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" \
            --tag "scalarapi/playwright:$IMAGE_TAG-$ARCH" "$PLAYWRIGHT_DOCKER_DIR"
          docker buildx build --load --platform "linux/$ARCH" \
            --build-arg "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" \
            --file "$PLAYWRIGHT_DOCKER_DIR/DockerfileRunner" \
            --tag "scalarapi/playwright-runner:$IMAGE_TAG-$ARCH" "$PLAYWRIGHT_DOCKER_DIR"
      - name: Smoke-test both images
        shell: bash
        run: |
          smoke_test() {
            local expected="$1"
            shift
            docker run --rm -i "$@" sh -c 'NODE_PATH="$(npm root -g)" node - "$1"' sh "$expected" \
              < "$PLAYWRIGHT_DOCKER_SMOKE_TEST"
          }

          smoke_test enabled "scalarapi/playwright:$IMAGE_TAG-$ARCH"
          smoke_test disabled "scalarapi/playwright-runner:$IMAGE_TAG-$ARCH"
          smoke_test enabled -e SCALAR_RUNNER_ENABLE_WEBGL=1 "scalarapi/playwright-runner:$IMAGE_TAG-$ARCH"
          smoke_test disabled -e SCALAR_RUNNER_ENABLE_WEBGL=true "scalarapi/playwright-runner:$IMAGE_TAG-$ARCH"
      - name: Archive tested images
        if: github.event_name == 'push' && github.repository == 'scalar/scalar'
        shell: bash
        run: |
          docker save "scalarapi/playwright:$IMAGE_TAG-$ARCH" "scalarapi/playwright-runner:$IMAGE_TAG-$ARCH" |
            zstd -T0 -o "$RUNNER_TEMP/playwright-images-$ARCH.tar.zst"
      - name: Upload tested images
        if: github.event_name == 'push' && github.repository == 'scalar/scalar'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/playwright-images-${{ matrix.arch }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish:
    needs: [check-changes, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'scalar/scalar'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-dockerhub
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.check-changes.outputs.tag }}
    steps:
      - name: Download tested images
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: playwright-images-*
          path: ${{ runner.temp }}/playwright-images
          merge-multiple: true
      - name: Log in to Docker Hub with OIDC
        uses: docker/login-action@v4.5.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: scalarapi
      - name: Push tested images and create multi-architecture tags
        shell: bash
        run: |
          for arch in amd64 arm64; do
            zstd -dc "$RUNNER_TEMP/playwright-images/playwright-images-$arch.tar.zst" | docker load
            docker push "scalarapi/playwright:$IMAGE_TAG-$arch"
            docker push "scalarapi/playwright-runner:$IMAGE_TAG-$arch"
          done

          for image in scalarapi/playwright scalarapi/playwright-runner; do
            docker buildx imagetools create --tag "$image:$IMAGE_TAG" "$image:$IMAGE_TAG-amd64" "$image:$IMAGE_TAG-arm64"
            echo "Published \`$image:$IMAGE_TAG\` for amd64 and arm64." >> "$GITHUB_STEP_SUMMARY"
          done
