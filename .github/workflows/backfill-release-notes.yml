name: Backfill release notes

on:
  push:
    branches: [codex/backfill-release-notes]
    paths: [.github/workflows/backfill-release-notes.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-release-notes
  cancel-in-progress: false

jobs:
  backfill:
    if: github.repository == 'scalar/scalar' && github.ref == 'refs/heads/codex/backfill-release-notes' && github.actor == 'hanspagel'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @scalar/release-notes... build

      - name: Backfill missing releases
        id: generate
        continue-on-error: true
        run: pnpm exec tsx .github/actions/backfill-release-notes/run.ts
        env:
          BACKFILL_SINCE: '2026-06-01'
          BACKFILL_DRY_RUN: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Format generated notes
        if: steps.generate.outputs.checkpoint-restored == 'true'
        run: |
          pnpm exec prettier --write \
            packages/api-reference/RELEASE_NOTES.{json,md} \
            projects/scalar-app/RELEASE_NOTES.{json,md} \
            packages/agent-chat/RELEASE_NOTES.{json,md} \
            packages/mock-server/RELEASE_NOTES.{json,md}

      - name: Commit generated notes to this PR
        if: steps.generate.outputs.checkpoint-restored == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_BRANCH: codex/backfill-release-notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/api-reference/RELEASE_NOTES.{json,md} \
            projects/scalar-app/RELEASE_NOTES.{json,md} \
            packages/agent-chat/RELEASE_NOTES.{json,md} \
            packages/mock-server/RELEASE_NOTES.{json,md}
          if ! git diff --cached --quiet; then
            git commit -m 'docs(release-notes): backfill historical product releases'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$BACKFILL_BRANCH"
          fi

      - name: Report generation failure
        if: steps.generate.outcome == 'failure'
        run: exit 1
