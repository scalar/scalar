name: Update Contributors in README

on:
  schedule:
    # Run every Friday at 15:00 UTC
    - cron: '0 15 * * 5'

permissions:
  contents: read

jobs:
  update-readme:
    name: Update the README
    if: ${{ github.repository_owner == 'scalar' }}
    runs-on: blacksmith-2vcpu-ubuntu-2204
    # Holds the release bot app credentials so the README PR is opened by the
    # app rather than by GITHUB_TOKEN. Pull requests created with GITHUB_TOKEN
    # do not trigger workflow events, so their CI checks stay pending forever.
    environment: release-bot
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update the list of contributors
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { readFile, writeFile } = require('node:fs/promises')
            const [collaborators, contributors] = await Promise.all([
              github.paginate(github.rest.repos.listCollaborators, {
                ...context.repo,
                affiliation: 'direct',
                per_page: 100,
              }),
              github.paginate(github.rest.repos.listContributors, {
                ...context.repo,
                per_page: 100,
              }),
            ])
            // Node 24 runs this dependency-free TypeScript helper directly.
            const { generateContributors } = await import(
              `${process.env.GITHUB_WORKSPACE}/tooling/scripts/src/helpers/generate-contributors.ts`
            )
            const readme = await readFile('README.md', 'utf8')
            await writeFile('README.md', generateContributors(readme, collaborators, contributors))

      - name: Create pull request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: contributors-readme-action-update
          commit-message: 'docs(contributor): update README contributors'
          title: 'docs(contributor): update README contributors'
          body: Auto-generated list of contributors.
          add-paths: README.md
