# pnpm 12 replaces onlyBuiltDependencies/ignoredBuiltDependencies with a single
# allowBuilds map: true runs the package's build scripts, false skips them.
allowBuilds:
  '@firebase/util': false
  '@nestjs/core': true
  '@parcel/watcher': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: false
  core-js-pure: false
  dtrace-provider: false
  electron: true
  esbuild: false
  lefthook: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  vue-demi: false
  workerd: false

# pnpm 12 no longer reads the "pnpm" field in package.json; overrides live here now.
overrides:
  '@types/node': catalog:*
  fast-uri@3.1.2: 3.0.1
  lodash: 4.18.1
  # Keep Mermaid's transitive Lodash ES dependency on the patched release.
  lodash-es: 4.18.1
  property-information: 7.2.0
  # Keep existing transitive consumers on the patched v7 release.
  undici@<8: 7.30.1
  undici@>=8: catalog:*

# Do not lower this value; add popular packages to minimumReleaseAgeExclude or wait before updating.
minimumReleaseAge: 7200 # 5 days

minimumReleaseAgeExclude:
  # Lets trust ourselves
  - '@scalar/*'
  # Renovate security update: flatted@3.4.0
  - flatted@3.4.0
  # Renovate security update: astro@6.0.0 || 5.18.1
  - astro@6.0.0 || 5.18.1
  # Renovate security update: yaml@2.8.3
  - yaml@2.8.3
  # Renovate security update: picomatch@4.0.4
  - picomatch@4.0.4
  # Renovate security update: next@15.5.14
  - next@15.5.14
  # Renovate security update: ajv@8.18.0
  - ajv@8.18.0
  # Electron runtime update, released September 29, 2026
  - electron@44.5.1
  # Security patches for the October 2026 Undici advisories.
  - undici@7.30.1
  # Explicitly reviewed Undici 8 upgrade.
  - undici@8.12.3
