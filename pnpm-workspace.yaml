# pnpm 12 replaces onlyBuiltDependencies/ignoredBuiltDependencies with a single
# allowBuilds map: true runs the package's build scripts, false skips them.
allowBuilds:
  '@firebase/util': false
  '@nestjs/core': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: false
  core-js-pure: false
  dtrace-provider: false
  electron: true
  esbuild: false
  lefthook: true
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  vue-demi: false
  workerd: false

# pnpm 12 no longer reads the "pnpm" field in package.json; overrides live here now.
overrides:
  # Postman 5 pins vulnerable Faker 5; the collection patch migrates its generators.
  # Workspace Node 24 supports requiring Faker 10 ES modules from Postman CommonJS.
  # TODO: Remove this override and patch when Postman supports patched Faker.
  'postman-collection>@faker-js/faker': catalog:*
  # Firestore pins gRPC to 1.9, which still has authentication vulnerabilities.
  # TODO: Remove when Firestore includes gRPC 1.13.6 or newer.
  '@firebase/firestore@4.18.0>@grpc/grpc-js': 1.13.6
  # Monaco 0.57 pins DOMPurify before the fixes in 3.4.17.
  'monaco-editor@0.57.0>dompurify': 3.4.17
  '@types/node': catalog:*
  # Docusaurus still requests older worker and serialization packages.
  # TODO: Remove these overrides when its dependencies include the security fixes.
  '@docusaurus/core>tinypool': 2.1.2
  'serialize-javascript@<7.1.3': 7.1.4
  # Upgrade the matching engine and walker together; old glob uses removed minimatch APIs.
  # Preserve glob 6/7 and minimatch 3/5, which are outside these advisory ranges.
  'glob@>=9.0.0 <14.0.2': 14.0.2
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
  # UUID 11 retains the CommonJS and browser exports used by Postman and SockJS.
  'uuid@<11.1.1': 11.1.1
  # React Hooks lint tooling also accepts the patched Zod 4 catalog version.
  'zod@>=4.0.0 <4.6.6': catalog:*
  fast-uri@3.1.2: 4.2.3
  lodash: 4.18.1
  # Keep Mermaid's transitive Lodash ES dependency on the patched release.
  lodash-es: 4.18.1
  property-information: 7.2.0
  # Keep existing transitive consumers on the patched v7 release.
  undici@<8: 7.30.2
  undici@>=8: catalog:*

# Do not lower this value; add popular packages to minimumReleaseAgeExclude or wait before updating.
minimumReleaseAge: 1440 # 1 day

minimumReleaseAgeExclude:
  # Trust packages published by Scalar.
  - '@scalar/*'
patchedDependencies:
  pbkit@0.0.72: patches/pbkit@0.0.72.patch
  postman-collection@5.3.1: patches/postman-collection@5.3.1.patch
