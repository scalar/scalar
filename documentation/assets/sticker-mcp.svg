<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150" fill="none" role="img" aria-label="MCP sticker">
  <g transform="rotate(-4 75 75)">
    <!-- Die-cut sticker body -->
    <path class="green" stroke="#DCDCDC" stroke-width="3" d="M75 6 L135 40 V110 L75 144 L15 110 V40 Z" stroke-linejoin="round"/>
    <!-- Inner hairline for the printed-sticker feel -->
    <path stroke="#DCDCDC" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2.5 2.5" d="M75 17 L125 45.5 V104.5 L75 133 L25 104.5 V45.5 Z" stroke-linejoin="round"/>
    <text x="75" y="44" text-anchor="middle" fill="#DCDCDC" xml:space="preserve" style="font-size:6.5px;font-weight:800;letter-spacing:.2em">SCALAR.COM</text>
    <!-- Sparkle, matching the MCP &amp; Agent icon in the sidebar -->
    <path fill="#DCDCDC" d="M75 48 l2.6 7.4 7.4 2.6 -7.4 2.6 -2.6 7.4 -2.6 -7.4 -7.4 -2.6 7.4 -2.6 z"/>
    <text x="75" y="101" text-anchor="middle" fill="#DCDCDC" xml:space="preserve" style="font-size:38px;font-weight:800;letter-spacing:-.02em">MCP</text>
    <text x="75" y="115" text-anchor="middle" fill="#DCDCDC" xml:space="preserve" style="font-size:5.4px;font-weight:800;letter-spacing:.22em">HOSTED • SERVERS</text>
  </g>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif; }
    .green { fill: #00a67d; }
    @media (color-gamut: p3) { .green { fill: color(display-p3 0.023529 0.564706 0.380392 / 1); } }
  </style>
</svg>
