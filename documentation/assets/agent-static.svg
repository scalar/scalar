<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="765" viewBox="0 0 1360 765">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="frame light-mode">
  <header class="top">
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM9 5v14"/></svg>
    <svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    <svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <span class="title"><svg xmlns="http://www.w3.org/2000/svg" class="hico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v9H4zM2 18h20"/></svg>Scalar Galaxy API<svg xmlns="http://www.w3.org/2000/svg" class="hico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    <span class="pill"><svg xmlns="http://www.w3.org/2000/svg" class="" width="12" height="12" viewBox="0 0 39 39"><path fill="currentColor" d="M22.65.05c.4 0 .8.3.8.8v8.8l6-6.2c.3-.4.9-.4 1.1 0l4.6 4.6c.3.3.4.8 0 1v.1l-6 6.2h8.5c.5 0 .8.3.8.8v6.6c0 .5-.3.8-.8.8h-8.6l6.1 6.2c.3.3.4.8 0 1.1l-4.6 4.7c-.2.3-.8.4-1 0l-6-6.2v8.8c0 .5-.4.8-.9.8h-6.4c-.5 0-.8-.3-.8-.8v-4.6c0-1.4.6-2.8 1.5-3.9l8.4-8.5c.9-1 .9-2.5 0-3.4l-8.3-8.5c-1-1-1.6-2.4-1.6-3.8V.85c0-.5.3-.8.8-.8h6.4zm-13.4 3.4h.2l14 14.4c1 1 1 2.5 0 3.4l-14 14.4c-.2.4-.8.4-1 0l-4.8-4.6c-.3-.3-.4-.7 0-1l6-6.4h-8.3c-.5 0-.8-.3-.8-.8v-6.6c0-.5.3-.8.8-.8h8.6l-6.2-6.2a1 1 0 010-1.1l4.5-4.7c.3-.3.8-.3 1 0z"/></svg>Scalar MCP<em><b></b>Connected</em></span>
    <span class="right"><svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"/></svg><svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg><svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></svg><svg xmlns="http://www.w3.org/2000/svg" class="hico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v.01M12 12v.01M12 19v.01"/></svg></span>
  </header>
  <section class="thread">
    <div class="user">Which planets in the Galaxy API are still missing an image? Upload the Kepler-22b render to that one.</div>
    <div class="assistant"><svg xmlns="http://www.w3.org/2000/svg" class="star" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg><div class="answer">
      <p>I’ll check through your Scalar MCP server.</p>
      <div class="tools">
        <div class="tool-row"><svg xmlns="http://www.w3.org/2000/svg" class="tool-ico" width="14" height="14" viewBox="0 0 39 39"><path fill="currentColor" d="M22.65.05c.4 0 .8.3.8.8v8.8l6-6.2c.3-.4.9-.4 1.1 0l4.6 4.6c.3.3.4.8 0 1v.1l-6 6.2h8.5c.5 0 .8.3.8.8v6.6c0 .5-.3.8-.8.8h-8.6l6.1 6.2c.3.3.4.8 0 1.1l-4.6 4.7c-.2.3-.8.4-1 0l-6-6.2v8.8c0 .5-.4.8-.9.8h-6.4c-.5 0-.8-.3-.8-.8v-4.6c0-1.4.6-2.8 1.5-3.9l8.4-8.5c.9-1 .9-2.5 0-3.4l-8.3-8.5c-1-1-1.6-2.4-1.6-3.8V.85c0-.5.3-.8.8-.8h6.4zm-13.4 3.4h.2l14 14.4c1 1 1 2.5 0 3.4l-14 14.4c-.2.4-.8.4-1 0l-4.8-4.6c-.3-.3-.4-.7 0-1l6-6.4h-8.3c-.5 0-.8-.3-.8-.8v-6.6c0-.5.3-.8.8-.8h8.6l-6.2-6.2a1 1 0 010-1.1l4.5-4.7c.3-.3.8-.3 1 0z"/></svg><span class="tool-src">Scalar MCP</span><span class="tool-fn">search_operations</span><code>planet image</code><span class="tool-res">2 operations</span><svg xmlns="http://www.w3.org/2000/svg" class="ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
        <div class="tool-row"><svg xmlns="http://www.w3.org/2000/svg" class="tool-ico" width="14" height="14" viewBox="0 0 39 39"><path fill="currentColor" d="M22.65.05c.4 0 .8.3.8.8v8.8l6-6.2c.3-.4.9-.4 1.1 0l4.6 4.6c.3.3.4.8 0 1v.1l-6 6.2h8.5c.5 0 .8.3.8.8v6.6c0 .5-.3.8-.8.8h-8.6l6.1 6.2c.3.3.4.8 0 1.1l-4.6 4.7c-.2.3-.8.4-1 0l-6-6.2v8.8c0 .5-.4.8-.9.8h-6.4c-.5 0-.8-.3-.8-.8v-4.6c0-1.4.6-2.8 1.5-3.9l8.4-8.5c.9-1 .9-2.5 0-3.4l-8.3-8.5c-1-1-1.6-2.4-1.6-3.8V.85c0-.5.3-.8.8-.8h6.4zm-13.4 3.4h.2l14 14.4c1 1 1 2.5 0 3.4l-14 14.4c-.2.4-.8.4-1 0l-4.8-4.6c-.3-.3-.4-.7 0-1l6-6.4h-8.3c-.5 0-.8-.3-.8-.8v-6.6c0-.5.3-.8.8-.8h8.6l-6.2-6.2a1 1 0 010-1.1l4.5-4.7c.3-.3.8-.3 1 0z"/></svg><span class="tool-src">Scalar MCP</span><span class="tool-fn">execute_operation</span><code>GET /planets</code><span class="tool-res">12 planets · 1 missing image</span><svg xmlns="http://www.w3.org/2000/svg" class="ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
        <div class="tool-row"><svg xmlns="http://www.w3.org/2000/svg" class="tool-ico" width="14" height="14" viewBox="0 0 39 39"><path fill="currentColor" d="M22.65.05c.4 0 .8.3.8.8v8.8l6-6.2c.3-.4.9-.4 1.1 0l4.6 4.6c.3.3.4.8 0 1v.1l-6 6.2h8.5c.5 0 .8.3.8.8v6.6c0 .5-.3.8-.8.8h-8.6l6.1 6.2c.3.3.4.8 0 1.1l-4.6 4.7c-.2.3-.8.4-1 0l-6-6.2v8.8c0 .5-.4.8-.9.8h-6.4c-.5 0-.8-.3-.8-.8v-4.6c0-1.4.6-2.8 1.5-3.9l8.4-8.5c.9-1 .9-2.5 0-3.4l-8.3-8.5c-1-1-1.6-2.4-1.6-3.8V.85c0-.5.3-.8.8-.8h6.4zm-13.4 3.4h.2l14 14.4c1 1 1 2.5 0 3.4l-14 14.4c-.2.4-.8.4-1 0l-4.8-4.6c-.3-.3-.4-.7 0-1l6-6.4h-8.3c-.5 0-.8-.3-.8-.8v-6.6c0-.5.3-.8.8-.8h8.6l-6.2-6.2a1 1 0 010-1.1l4.5-4.7c.3-.3.8-.3 1 0z"/></svg><span class="tool-src">Scalar MCP</span><span class="tool-fn">execute_operation</span><code>POST /planets/{planetId}/image</code><span class="tool-res">201 Created</span><svg xmlns="http://www.w3.org/2000/svg" class="ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
      </div>
      <p>Kepler-22b was the only planet without an image. I uploaded <code>kepler-22b.png</code> and the API returned <b>201 Created</b>. Want me to add the TRAPPIST-1e render next?</p>
    </div></div>
  </section>
  <footer class="composer">
    <div class="placeholder">Reply to Claude…</div>
    <div class="bar">
      <span class="iconbtn"><svg xmlns="http://www.w3.org/2000/svg" class="" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="chip"><svg xmlns="http://www.w3.org/2000/svg" class="" width="13" height="13" viewBox="0 0 39 39"><path fill="currentColor" d="M22.65.05c.4 0 .8.3.8.8v8.8l6-6.2c.3-.4.9-.4 1.1 0l4.6 4.6c.3.3.4.8 0 1v.1l-6 6.2h8.5c.5 0 .8.3.8.8v6.6c0 .5-.3.8-.8.8h-8.6l6.1 6.2c.3.3.4.8 0 1.1l-4.6 4.7c-.2.3-.8.4-1 0l-6-6.2v8.8c0 .5-.4.8-.9.8h-6.4c-.5 0-.8-.3-.8-.8v-4.6c0-1.4.6-2.8 1.5-3.9l8.4-8.5c.9-1 .9-2.5 0-3.4l-8.3-8.5c-1-1-1.6-2.4-1.6-3.8V.85c0-.5.3-.8.8-.8h6.4zm-13.4 3.4h.2l14 14.4c1 1 1 2.5 0 3.4l-14 14.4c-.2.4-.8.4-1 0l-4.8-4.6c-.3-.3-.4-.7 0-1l6-6.4h-8.3c-.5 0-.8-.3-.8-.8v-6.6c0-.5.3-.8.8-.8h8.6l-6.2-6.2a1 1 0 010-1.1l4.5-4.7c.3-.3.8-.3 1 0z"/></svg>Scalar MCP<b></b></span>
      <span class="model">Claude<svg xmlns="http://www.w3.org/2000/svg" class="" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      <span class="send"><svg xmlns="http://www.w3.org/2000/svg" class="" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
    </div>
  </footer>
</div>
    <style>*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
svg{display:block;flex-shrink:0}
.frame{--system-fonts:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font:"Inter",var(--system-fonts);--mono:ui-monospace,"SF Mono",Menlo,Monaco,monospace;--accent:#d97757;
  font-family:var(--font);font-size:14px;line-height:1.3;width:1360px;height:765px;display:flex;flex-direction:column;overflow:hidden;border-radius:8px;border:1px solid var(--frame-border);background:var(--bg-1);color:var(--c-1)}
.light-mode{--c-1:#000;--c-2:#666;--c-3:#8e8e8e;--bg-1:#fff;--bg-2:#f6f6f6;--bg-3:#e7e7e7;--border:rgba(0,0,0,.08);--frame-border:#dbdbdb;--green:#00a67d;--avatar:#e9ddc9;--avatar-c:#5b4630}
.dark-mode{--c-1:rgba(255,255,255,.9);--c-2:rgba(255,255,255,.62);--c-3:rgba(255,255,255,.44);--bg-1:#0f0f0f;--bg-2:#1a1a1a;--bg-3:#272727;--border:rgba(255,255,255,.1);--frame-border:rgba(255,255,255,.12);--green:#00b848;--avatar:#3b3127;--avatar-c:#e9ddc9}
.lights{display:flex;gap:4px;margin-right:18px}

.lights i{width:10px;height:10px;border-radius:50%;display:block;background:var(--bg-3)}
.star{color:var(--accent)}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.top{height:40px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.hico{color:var(--c-3)}
.title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;margin-left:4px;color:var(--c-2)}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{margin-left:4px;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg-1);font-size:12px;color:var(--c-3)}
.pill em{display:flex;align-items:center;gap:5px;font-style:normal;font-size:11px;color:var(--c-3)}
.title{font-weight:500}
.muted{color:var(--c-3)}
.share{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-2);border:1px solid var(--border);border-radius:7px;height:30px;padding:0 10px}
.thread{display:flex;flex-direction:column;gap:22px;padding:30px 32px 0;max-width:780px}
.user{align-self:flex-start;background:var(--bg-2);border-radius:16px 16px 16px 6px;padding:12px 16px;font-size:15px;line-height:23px;max-width:560px}
.assistant{display:flex;gap:14px;align-items:flex-start}
.assistant .star{margin-top:3px}
.answer{display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:24px;min-width:0}
.answer code,.tool-row code{font-family:var(--mono);font-size:12.5px;background:var(--bg-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--c-1);white-space:nowrap}
.tools{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tool-row{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;font-size:13px;color:var(--c-2);white-space:nowrap}
.tool-row + .tool-row{border-top:1px solid var(--border)}
.tool-ico{color:var(--c-2)}
.tool-fn{font-family:var(--mono);font-size:12.5px;color:var(--c-1)}
.tool-res{margin-left:auto;color:var(--c-3)}
.ok{color:var(--green)}
.composer{margin:auto 32px 24px;max-width:780px;border:1px solid var(--border);border-radius:14px;background:var(--bg-1);box-shadow:0 2px 10px rgba(0,0,0,.05);padding:14px 14px 12px}
.placeholder{font-size:15px;color:var(--c-3);padding:0 4px 16px}
.bar{display:flex;align-items:center;gap:8px}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--c-2)}
.chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;color:var(--c-1)}
.model{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--c-2)}
.send{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.pill em b{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--c-3)}
</style>
  </foreignObject>
</svg>
