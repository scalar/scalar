<svg xmlns="http://www.w3.org/2000/svg" width="618" height="366" viewBox="0 0 618 366" fill="none">
<style>
/* Infinite square-tunnel zoom. All rings share one keyframe track, staggered by
   -1.4s steps (12.6s / 9 rings), so the pattern is perfectly periodic. Scale
   stops form a geometric series (x1.54 per stop) with keyframes at exact
   stagger multiples, which keeps each ring's outer edge locked to the next
   ring's inner edge at every frame - no gaps, no drift. Every square is fully
   solid for its whole life: it covers the front cover, exits by sliding off
   through the top corners (revealing the next square), and only wraps back to
   the center once the face masks have clipped it away completely. */
.skgRing{transform-box:view-box;transform-origin:0 0;animation:skgZoom 12.6s linear infinite}
.skgD1{animation-delay:-1.4s}.skgD2{animation-delay:-2.8s}.skgD3{animation-delay:-4.2s}.skgD4{animation-delay:-5.6s}.skgD5{animation-delay:-7s}.skgD6{animation-delay:-8.4s}.skgD7{animation-delay:-9.8s}.skgD8{animation-delay:-11.2s}
@keyframes skgZoom{
0%{transform:translate(324.5px,258.1px) scale(.3);fill:#FF2E00}
11.1111%{transform:translate(324.5px,258.1px) scale(.462);fill:#FF3D00}
22.2222%{transform:translate(324.5px,258.1px) scale(.71148);fill:#FF4D00}
33.3333%{transform:translate(324.5px,258.1px) scale(1.09568);fill:#FF5C00}
44.4444%{transform:translate(324.5px,258.1px) scale(1.68735);fill:#FF6B00}
55.5556%{transform:translate(324.5px,258.1px) scale(2.59851);fill:#FF7A00}
66.6667%{transform:translate(324.5px,258.1px) scale(4.00171);fill:#FF8A00}
77.7778%{transform:translate(324.5px,258.1px) scale(6.16263);fill:#FF9900}
88.8889%{transform:translate(324.5px,258.1px) scale(9.49045);fill:#FFA500}
100%{transform:translate(324.5px,258.1px) scale(14.6153);fill:#FFA500}
}
.skgTxt{font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000;fill-opacity:.7;white-space:pre}
.skgStatic{display:none}
@media (prefers-reduced-motion:reduce){.skgAnim{display:none}.skgStatic{display:inline}}
</style>
