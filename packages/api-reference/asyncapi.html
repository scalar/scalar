<!doctype html>
<html>
  <head>
    <title>AsyncAPI Rendering Playground</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script
      src="src/standalone.ts"
      type="module"></script>
    <script type="module">
      import galaxyAsyncApi from '../galaxy/src/documents/asyncapi/3.0.yaml?raw'

      const params = new URLSearchParams(location.search)
      Scalar.createApiReference('#app', {
        layout: params.get('layout') === 'classic' ? 'classic' : 'modern',
        sources: [
          {
            title: 'Commerce · Kafka',
            slug: 'commerce',
            url: '/examples/asyncapi-design-commerce.json',
          },
          {
            title: 'Fleet · MQTT',
            slug: 'fleet',
            url: '/examples/asyncapi-design-fleet.json',
          },
          {
            title: 'Team Chat · WebSockets',
            slug: 'chat',
            url: '/examples/asyncapi-design-chat.json',
          },
          {
            title: 'Scalar Galaxy Events',
            slug: 'galaxy',
            content: galaxyAsyncApi,
          },
        ],
        defaultOpenAllTags: true,
      })
    </script>
  </body>
</html>
