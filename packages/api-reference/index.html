<!doctype html>
<html>
  <head>
    <title>Scalar API Reference</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div id="app"></div>

    <!-- Our Script -->
    <script
      src="src/standalone.ts"
      type="module"></script>

    <!-- Initialize the Scalar API Reference -->
    <script type="module">
      import { sources } from './test/utils/sources.ts'

      // Dev-only URL switches, so a layout or an opt-in flag can be exercised
      // without editing this file: ?layout=legacy, ?kbd=1
      const params = new URLSearchParams(location.search)
      const layout = params.get('layout')

      Scalar.createApiReference('#app', {
        sources,
        ...(layout ? { schemaLayout: layout } : {}),
        ...(params.has('kbd') ? { schemaKeyboardNav: true } : {}),
        persistAuth: true,
        // Avoid CORS issues
        proxyUrl: 'https://proxy.scalar.com',
        setPageTitle: ({ title, document }) => `${document.title} – ${title}`,
      })
    </script>
  </body>
</html>
