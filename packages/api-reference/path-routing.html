<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <title>Scalar — Path routing</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import '/src/standalone.ts'

      import content from '@scalar/galaxy/latest.json'

      Scalar.createApiReference('#app', {
        content,
        pathRouting: { basePath: '/path-routing' },
        darkMode: false,
        showDeveloperTools: 'never',
      })
    </script>
  </body>
</html>
