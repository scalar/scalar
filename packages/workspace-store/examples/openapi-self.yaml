openapi: 3.2.1
$self: https://example.com/descriptions/openapi-self.yaml
info:
  title: Document identity example
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /pet:
    get:
      summary: Get a pet
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                # Resolves against $self, even when this file is loaded from a mirror.
                $ref: openapi-self.yaml#/components/schemas/Pet
components:
  schemas:
    Pet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          examples:
            - Mochi
